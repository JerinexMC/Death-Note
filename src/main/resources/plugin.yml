name: DeathNote
version: 1.0.0
main: com.deathnote.DeathNotePlugin
api-version: '1.21'
authors: [JerinexMC]
softdepend: [PvpBot]

commands:
  deathnote:
    description: DeathNote administration
    usage: /deathnote <give|execute|methods|history|cancel|reload>
    aliases: [dn]

permissions:
  deathnote.admin:
    default: op
  deathnote.use:
    default: true
